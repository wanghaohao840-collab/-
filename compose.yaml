services:
  app:
    image: python_self_agent-app:local
    build:
      context: .
      dockerfile: Dockerfile
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/.env}
    environment:
      PDF_ASSISTANT_DATA_DIR: /app/data
      RAG_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      APP_HOST: "0.0.0.0"
      APP_PORT: "${APP_PORT:-7860}"
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-7860}:${APP_PORT:-7860}"
    volumes:
      - "${DEPLOY_DATA_ROOT:-./deploy-data}/app:/app/data"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  qdrant:
    image: python_self_agent-qdrant:local
    build:
      context: .
      dockerfile: deploy/qdrant.Dockerfile
    expose:
      - "6333"
    volumes:
      - "${DEPLOY_DATA_ROOT:-./deploy-data}/qdrant:/qdrant/storage"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1:6333/readyz >/dev/null"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    networks:
      - app_net
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  neo4j:
    profiles:
      - graph
    image: neo4j:5.26.28-community@sha256:ff32db30b2baff97971e441b46bfd9c832c1b62c970398ef579244c06b21d357
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/.env}
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
    expose:
      - "7474"
      - "7687"
    volumes:
      - "${DEPLOY_DATA_ROOT:-./deploy-data}/neo4j/data:/data"
    healthcheck:
      test:
        - CMD-SHELL
        - "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD}\" 'RETURN 1' >/dev/null"
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 10
    networks:
      - app_net
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

networks:
  app_net:
    driver: bridge
